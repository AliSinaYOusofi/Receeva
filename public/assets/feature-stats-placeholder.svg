<svg width="320" height="640" viewBox="0 0 320 640" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Statistics screen placeholder">
  <rect x="2" y="2" width="316" height="636" rx="46" fill="#1a1b20"/>
  <rect x="12" y="12" width="296" height="616" rx="38" fill="#f8f9fc"/>
  <rect x="124" y="26" width="72" height="8" rx="4" fill="#1a1b20"/>
  <g font-family="Inter, system-ui, sans-serif">
    <text x="36" y="84" font-size="9" letter-spacing="2" fill="#6e6e73">INSIGHTS</text>
    <text x="36" y="112" font-size="22" font-weight="700" fill="#000000" letter-spacing="-0.02em">Last 6 months</text>
    <!-- chart card -->
    <rect x="28" y="132" width="264" height="180" rx="16" fill="#ffffff"/>
    <!-- bars: sent (dark) vs received (light) -->
    <g>
      <rect x="52" y="220" width="14" height="64" rx="4" fill="#000000"/>
      <rect x="70" y="248" width="14" height="36" rx="4" fill="#dde1e6"/>
      <rect x="104" y="196" width="14" height="88" rx="4" fill="#000000"/>
      <rect x="122" y="232" width="14" height="52" rx="4" fill="#dde1e6"/>
      <rect x="156" y="236" width="14" height="48" rx="4" fill="#000000"/>
      <rect x="174" y="204" width="14" height="80" rx="4" fill="#dde1e6"/>
      <rect x="208" y="180" width="14" height="104" rx="4" fill="#000000"/>
      <rect x="226" y="244" width="14" height="40" rx="4" fill="#dde1e6"/>
    </g>
    <rect x="44" y="300" width="10" height="10" rx="3" fill="#000000"/>
    <text x="60" y="309" font-size="9" fill="#46464b">Sent</text>
    <rect x="108" y="300" width="10" height="10" rx="3" fill="#dde1e6"/>
    <text x="124" y="309" font-size="9" fill="#46464b">Received</text>
    <!-- mini stats -->
    <rect x="28" y="328" width="124" height="72" rx="14" fill="#ffffff"/>
    <text x="44" y="356" font-size="9" letter-spacing="1.5" fill="#6e6e73">TOP CONTACT</text>
    <text x="44" y="380" font-size="15" font-weight="700" fill="#000000" letter-spacing="-0.02em">Customer A</text>
    <rect x="168" y="328" width="124" height="72" rx="14" fill="#ffffff"/>
    <text x="184" y="356" font-size="9" letter-spacing="1.5" fill="#6e6e73">BUSIEST DAY</text>
    <text x="184" y="380" font-size="15" font-weight="700" fill="#000000" letter-spacing="-0.02em">Friday</text>
    <!-- by currency rows -->
    <text x="36" y="436" font-size="9" letter-spacing="1.5" fill="#6e6e73">BY CURRENCY</text>
    <rect x="36" y="448" width="220" height="8" rx="4" fill="#000000"/>
    <text x="284" y="455" text-anchor="end" font-size="10" fill="#46464b">USD</text>
    <rect x="36" y="468" width="150" height="8" rx="4" fill="#46464b"/>
    <text x="284" y="475" text-anchor="end" font-size="10" fill="#46464b">EUR</text>
    <rect x="36" y="488" width="92" height="8" rx="4" fill="#dde1e6"/>
    <text x="284" y="495" text-anchor="end" font-size="10" fill="#46464b">GBP</text>
    <text x="160" y="612" text-anchor="middle" font-size="8" letter-spacing="2" fill="#6e6e73">PLACEHOLDER · STATISTICS</text>
  </g>
</svg>
