<svg width="320" height="640" viewBox="0 0 320 640" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Currency converter screen placeholder">
  <rect x="2" y="2" width="316" height="636" rx="46" fill="#1a1b20"/>
  <rect x="12" y="12" width="296" height="616" rx="38" fill="#f8f9fc"/>
  <rect x="124" y="26" width="72" height="8" rx="4" fill="#1a1b20"/>
  <g font-family="Inter, system-ui, sans-serif">
    <text x="36" y="84" font-size="9" letter-spacing="2" fill="#6e6e73">CONVERTER</text>
    <text x="36" y="112" font-size="22" font-weight="700" fill="#000000" letter-spacing="-0.02em">One balance</text>
    <!-- from card -->
    <rect x="28" y="136" width="264" height="92" rx="16" fill="#ffffff"/>
    <text x="48" y="166" font-size="9" letter-spacing="1.5" fill="#6e6e73">FROM</text>
    <text x="48" y="200" font-size="26" font-weight="700" fill="#000000" letter-spacing="-0.02em">€1,000.00</text>
    <rect x="222" y="156" width="50" height="26" rx="13" fill="#eceef1"/>
    <text x="247" y="173" text-anchor="middle" font-size="11" font-weight="600" fill="#000000">EUR</text>
    <!-- swap -->
    <circle cx="160" cy="240" r="18" fill="#000000"/>
    <path d="M154 236 h12 M160 230 l6 6 -6 6" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- to card -->
    <rect x="28" y="262" width="264" height="92" rx="16" fill="#000000"/>
    <text x="48" y="292" font-size="9" letter-spacing="1.5" fill="#9a9aa0">TO · HOME</text>
    <text x="48" y="326" font-size="26" font-weight="700" fill="#ffffff" letter-spacing="-0.02em">$1,084.20</text>
    <rect x="222" y="282" width="50" height="26" rx="13" fill="#2c2c2e"/>
    <text x="247" y="299" text-anchor="middle" font-size="11" font-weight="600" fill="#ffffff">USD</text>
    <!-- rate row -->
    <text x="36" y="392" font-size="11" fill="#46464b">Live rate</text>
    <text x="284" y="392" text-anchor="end" font-size="11" font-weight="600" fill="#000000">1 EUR = 1.0842 USD</text>
    <rect x="28" y="408" width="264" height="0.6" fill="#00000010"/>
    <text x="36" y="436" font-size="11" fill="#46464b">Updated</text>
    <text x="284" y="436" text-anchor="end" font-size="11" font-weight="600" fill="#000000">just now</text>
    <rect x="28" y="452" width="264" height="0.6" fill="#00000010"/>
    <text x="36" y="480" font-size="11" fill="#46464b">Manual fallback</text>
    <text x="284" y="480" text-anchor="end" font-size="11" font-weight="600" fill="#000000">Off</text>
    <rect x="28" y="540" width="264" height="44" rx="14" fill="#000000"/>
    <text x="160" y="567" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">Unify transactions</text>
    <text x="160" y="612" text-anchor="middle" font-size="8" letter-spacing="2" fill="#6e6e73">PLACEHOLDER · CONVERTER</text>
  </g>
</svg>
